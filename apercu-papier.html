<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Aperçu papier — R507</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Alegreya+Sans:wght@400;500;700;800&family=Courier+Prime:wght@400;700&display=swap"
    />
    <style>
      /* Aperçu de la direction « maquette en papier découpé ». Page à part : l'application n'est pas modifiée. */
      :root {
        --desk: #e9dfcc;
        --card: #f7f1e6;
        --kraft: #c49a6c;
        --ink: #3a2f26;
        --muted: #6f6253;
        --accent: #c2543a;
        --tape: rgb(224 104 75 / 75%);
      }

      * {
        margin: 0;
        box-sizing: border-box;
      }

      html,
      body {
        height: 100%;
        overflow: hidden;
        background: var(--desk);
        color: var(--ink);
        font-family: 'Alegreya Sans', 'Segoe UI', sans-serif;
        font-size: 17px;
        line-height: 1.45;
      }

      canvas {
        display: block;
      }

      .labels {
        position: fixed;
        inset: 0;
        pointer-events: none;
      }

      /* Étiquette de papier collée au-dessus des coffres. */
      .tag {
        padding: 2px 10px;
        background: var(--card);
        border: 1px solid rgb(58 47 38 / 25%);
        box-shadow: 1px 2px 0 rgb(58 47 38 / 15%);
        color: var(--muted);
        font-family: 'Courier Prime', monospace;
        font-size: 0.78rem;
        rotate: -2deg;
      }

      /* Panneau : une fiche cartonnée tenue par deux bouts de ruban adhésif. */
      #panel {
        position: fixed;
        top: 28px;
        left: 28px;
        width: 360px;
        max-height: calc(100% - 56px);
        overflow-y: auto;
        padding: 30px 28px 24px;
        background:
          repeating-linear-gradient(0deg, transparent 0 27px, rgb(120 150 190 / 18%) 27px 28px),
          var(--card);
        box-shadow:
          0 1px 1px rgb(0 0 0 / 8%),
          4px 8px 18px rgb(80 60 40 / 22%);
        rotate: -0.8deg;
      }

      #panel::before,
      #panel::after {
        content: '';
        position: absolute;
        top: -10px;
        width: 90px;
        height: 24px;
        background: var(--tape);
      }

      #panel::before {
        left: 18px;
        rotate: -6deg;
      }

      #panel::after {
        right: 18px;
        rotate: 5deg;
      }

      .kicker {
        color: var(--accent);
        font-family: 'Courier Prime', monospace;
        font-size: 0.85rem;
        font-weight: 700;
        letter-spacing: 0.04em;
        text-transform: uppercase;
      }

      h1 {
        margin: 4px 0 10px;
        font-size: 2rem;
        font-weight: 800;
        line-height: 1.05;
      }

      p + p {
        margin-top: 8px;
      }

      .actions {
        display: flex;
        flex-direction: column;
        gap: 10px;
        margin-top: 18px;
      }

      /* Bouton : un petit carton posé, qui s'enfonce quand on appuie. */
      button {
        padding: 10px 16px;
        border: 1.5px solid var(--ink);
        background: #fffaf1;
        box-shadow: 3px 3px 0 var(--ink);
        color: var(--ink);
        font: 700 0.98rem 'Alegreya Sans', sans-serif;
        text-align: left;
        cursor: pointer;
        transition: translate 80ms, box-shadow 80ms;
      }

      button:hover {
        background: #fff3df;
      }

      button:active,
      button[aria-pressed='true'] {
        translate: 2px 2px;
        box-shadow: 1px 1px 0 var(--ink);
      }

      button:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 3px;
      }

      #hash {
        margin-top: 16px;
        padding-top: 12px;
        border-top: 1.5px dashed rgb(58 47 38 / 35%);
        color: var(--muted);
        font-family: 'Courier Prime', monospace;
        font-size: 0.82rem;
        word-break: break-all;
      }

      @media (max-width: 760px) {
        #panel {
          top: auto;
          left: 10px;
          right: 10px;
          bottom: 10px;
          width: auto;
          max-height: 46vh;
          padding: 22px 20px 18px;
        }

        h1 {
          font-size: 1.5rem;
        }
      }
    </style>
  </head>
  <body>
    <section id="panel" aria-live="polite">
      <p class="kicker">Aperçu · direction papier</p>
      <h1>Le coffre en calque</h1>
      <p>Tout est en papier et en carton, comme une maquette posée sur un bureau.</p>
      <p>Le coffre a une fenêtre en <strong>papier calque</strong> : on devine ce qu’il contient sans l’ouvrir. Allume la lampe pour le lire, puis tamponne-le.</p>
      <div class="actions">
        <button id="lamp" type="button" aria-pressed="false">Allumer la lampe du coffre</button>
        <button id="stamp" type="button">Tamponner le coffre n°1</button>
        <button id="island" type="button" aria-pressed="false">Déplier l’île</button>
        <button id="plane" type="button">Envoyer un avion en papier</button>
      </div>
      <p id="hash">Calcul des sceaux…</p>
    </section>
    <script type="module" src="/src/apercu-papier.js"></script>
  </body>
</html>
