<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Blockchain 3D — R507</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <canvas id="scene" aria-label="Scène 3D : une chaîne de coffres de verre"></canvas>

    <section id="panel" aria-live="polite">
      <p id="step" class="step">Chargement…</p>
      <h1 id="title">Blockchain 3D</h1>
      <div id="text"></div>
      <button id="inspect" class="action" type="button" hidden>Inspecter le coffre</button>
      <dl id="fields" hidden></dl>
      <details id="en-vrai">
        <summary>En vrai…</summary>
        <p id="en-vrai-text"></p>
      </details>
      <nav id="nav" aria-label="Étapes du parcours">
        <button id="prev" type="button">← Précédent</button>
        <ol id="dots"></ol>
        <button id="next" type="button">Suivant →</button>
      </nav>
    </section>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
